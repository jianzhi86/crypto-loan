[build]
builder = "nixpacks"
buildCommand = "npx prisma generate && npm run build"

[deploy]
# Sync the Postgres schema to prisma/schema.prisma on every deploy (idempotent:
# creates missing tables/columns, no-op when already in sync) before starting.
startCommand = "npx prisma db push --skip-generate && npm start"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
